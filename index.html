<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بن ابن لقمان</title>
    <style>
        :root {
            --bg-color: #1a1917;
            --text-color: #ffffff;
            --gold-color: #c59f4e;
            --secondary-color: #262421;
            --accent-color: #a37f37;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 300px;
            background-color: var(--secondary-color);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 1px solid var(--gold-color);
            position: fixed;
            height: 100vh;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--gold-color);
            text-align: center;
            margin-bottom: 40px;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav ul li {
            margin-bottom: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 1.1rem;
            display: block;
            padding: 12px;
            border-radius: 5px;
            transition: all 0.3s;
            border-bottom: 1px solid transparent;
        }

        nav ul li a:hover {
            color: var(--gold-color);
            border-bottom-color: var(--gold-color);
        }

        .contact-info {
            font-size: 0.9rem;
            color: #aaa;
        }

        .contact-info p {
            margin: 8px 0;
        }

        .contact-info a {
            color: var(--gold-color);
            text-decoration: none;
        }

        /* Main Content */
        .main-content {
            margin-right: 300px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: var(--secondary-color);
            border-bottom: 1px solid var(--gold-color);
        }

        .search-bar {
            background-color: var(--bg-color);
            border: 1px solid var(--gold-color);
            padding: 10px 15px;
            border-radius: 20px;
            width: 350px;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            background: none;
            border: none;
            color: white;
            width: 100%;
            outline: none;
        }

        .header-icons a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 25px;
            font-size: 1.3rem;
            transition: color 0.3s;
        }

        .header-icons a:hover {
            color: var(--gold-color);
        }

        /* Hero Section */
        .hero {
            flex: 1;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('coffee-hero.jpg') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px;
        }

        .hero h2 {
            font-size: 3.5rem;
            color: var(--gold-color);
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.3rem;
            margin-bottom: 35px;
            max-width: 700px;
            line-height: 1.6;
        }

        .btn {
            background-color: transparent;
            color: var(--gold-color);
            padding: 15px 45px;
            text-decoration: none;
            border: 2px solid var(--gold-color);
            border-radius: 5px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: var(--gold-color);
            color: var(--bg-color);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-left: none;
                border-bottom: 1px solid var(--gold-color);
            }
            .main-content {
                margin-right: 0;
            }
            header {
                padding: 20px;
            }
            .search-bar {
                width: 250px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="logo">بن ابن لقمان</div>
            <nav>
                <ul>
                    <li><a href="#home">الرئيسية</a></li>
                    <li><a href="#products">منتجاتنا</a></li>
                    <li><a href="#about">قصتنا</a></li>
                    <li><a href="#contact">اتصل بنا</a></li>
                </ul>
            </nav>
        </div>
        <div class="contact-info">
            <p>تواصل معنا:</p>
            <p>هاتف: <a href="tel:01151495701">01151495701</a></p>
            <p>بريد: <a href="mailto:fattahwsmi@gmail.com">fattahwsmi@gmail.com</a></p>
        </div>
    </div>

    <div class="main-content">
        <header id="home">
            <div class="search-bar">
                <input type="text" placeholder="البحث...">
            </div>
            <div class="header-icons">
                <a href="#cart">🛒</a>
                <a href="#account">👤</a>
            </div>
        </header>

        <section class="hero">
            <h2>تجربة مذاق استثنائية</h2>
            <p>بن كولومبي متوازن بقوام غني ونكهة كلاسيكية محبوبة، تم تحميصه بعناية ليناسب ذوقك الرفيع.</p>
            <a href="tel:01151495701" class="btn">اطلب الآن</a>
        </section>
    </div>

</body>
</html>
